version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: madrilusa-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - madrilusa-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`madrilusa.com`,`www.madrilusa.com`)"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: madrilusa-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
      - ./backend/.env.production:/app/.env
      - ./logs:/app/logs
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./data/prod.db
    networks:
      - madrilusa-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: madrilusa-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - madrilusa-network

volumes:
  data:
    driver: local
  logs:
    driver: local
  ssl:
    driver: local

networks:
  madrilusa-network:
    driver: bridge